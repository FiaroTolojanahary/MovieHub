include: package:flutter_lints/flutter.yaml

# riverpod_lint 3 : plugin du serveur d'analyse (plus de custom_lint dans pubspec.yaml).
# movie_data ne déclare pas de provider, mais on garde la même configuration que l'app.
plugins:
  riverpod_lint: ^3.1.9

analyzer:
  exclude:
    - build/**
    - lib/**.g.dart
    - "**/*.freezed.dart"
  errors:
    # @JsonKey sur les paramètres des factory freezed
    invalid_annotation_target: ignore

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
